name: QuantumGoldPriceTest

on:
  workflow_dispatch:

jobs:
  test-price:
    runs-on: ubuntu-latest

    steps:
      - name: Get code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install requests
        run: |
          pip install requests

      - name: Run price test
        run: |
          python live_price_test.py
