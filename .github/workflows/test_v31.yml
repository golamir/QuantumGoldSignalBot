name: QuantumGold V3.1 Microstructure Test

on:
  workflow_dispatch:

jobs:
  test-v31:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy ta requests python-telegram-bot

      - name: Check Python version
        run: |
          python --version
          pip --version

      - name: Check V3.1 file exists
        run: |
          ls -la
          test -f QuantumGold_MASTER_FILTER_V3_1_Microstructure.py
          echo "V3.1 file found successfully."

      - name: Syntax check V3.1
        run: |
          python -m py_compile QuantumGold_MASTER_FILTER_V3_1_Microstructure.py
          echo "Syntax check passed."

      - name: Run QuantumGold V3.1
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python QuantumGold_MASTER_FILTER_V3_1_Microstructure.py
